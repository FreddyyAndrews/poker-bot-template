# Checks the bot on every push: setup, the spot suites, and a short match.
name: test
on: [push, pull_request]
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./setup.sh
      - run: make test
      - run: make match HANDS=100
